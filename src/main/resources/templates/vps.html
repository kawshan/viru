<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>vps master</title>


    <!--    bootstrap cdn links-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="/commonjs/selectcommonfunction.js"></script>
    <script src="/commonjs/jquery.js"></script>
    <script src="/commonjs/validation.js"></script>
    <script src="/commonjs/ajaxcommonfunction.js"></script>
    <script src="/commonjs/tablecommonfuntion.js"></script>
    <script src="/controllerjs/vps.js"></script>


    <!--    jquery cdn start-->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.css">
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.js"></script>
    <!--    jquery cdn end-->

    <!--    google icons link-->
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"/>


</head>
<body>

<!--<div th:replace="~{navbar::navbar}"></div>-->

<!--<div th:replace="~{offcanvas::offcanvas}"></div>-->


<div class="container-fluid">

    <!--header area start-->
    <div class="row p-4" style="background-color: #3C3D37;">
        <h1 class="text-center" style="color: whitesmoke">Vps Master</h1>
    </div>
    <!--header area start-->


    <!--button row start-->
    <div class="row mb-2 mt-2">


        <div class="col-md-5">
            <!--                div modify button 2 start-->
            <div id="divModifyButton2" class="d-none">
                <div class="col-md-12">
                    <button type="button" class="btn btn-warning fw-bold"
                            style="width: 15%; color: whitesmoke; border: 1px solid black;"
                            onclick="refillVpsHeader(window['editOb'],window['editRow'])">
                        <i class="fa-solid fa-recycle fa-beat"></i> Refill
                    </button>
                    <button type="button" class="btn btn-danger fw-bold"
                            style=" width: 15%; color: whitesmoke; border: 1px solid black; pointer-events: all"
                            onclick="deleteVpsHeader(window['editOb'],window['editRow'])">
                        <i class="fa-solid fa-trash fa-beat"></i> Delete
                    </button>
                    <button onclick="printVps(window['editOb'],window['editRow'])" type="button"
                            class="btn btn-primary fw-bold"
                            style=" width: 15%; color: whitesmoke;border: 1px solid black">
                        <i class="fa-solid fa-eye fa-beat"></i> Print
                    </button>
                </div>
            </div>
            <!--                div modify button 2 end-->
        </div>


        <div class="col-md-3">
            <button type="button" class="btn btn-danger" onclick="window.location.reload()">reset</button>
            <button type="button" class="btn btn-success" style="pointer-events: all" id="btnSubmitInvoiceHeader"
                    onclick="saveOrUpdateVpsHeader()">Submit
            </button>
        </div>


        <div class="col-md-4 text-end">
            <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#exampleModal2">
                Search
            </button>
        </div>


    </div>
    <!--button row end-->

    <!-- Vps header area start-->
    <div class="row p-4">
        <div class="col-md-2">
            <label for="textInvoiceNumber" class="form-label">Invoice Number</label>
            <input type="text" class="form-control text-start fw-bold" id="textInvoiceNumber" style="height: 80%"
                   placeholder="Enter Invoice Number"
                   onkeyup="textValidator(this,'','vpsHeader','vps_header_invoice_number'); getTotalInvoiceValue(this)">

        </div>
        <div class="col-md-2">
            <label for="textTotalInvoiceValue" class="form-label">Total Invoice Value</label>
            <input type="text" class="form-control text-start fw-bold" style="height: 80%" id="textTotalInvoiceValue"
                   placeholder="Amount Will Be Auto Generated" disabled>
        </div>
        <div class="col-md-2">
            <label for="textVpsNo" class="form-label">Vps No</label>
            <input type="text" class="form-control text-start fw-bold" style="height: 80%"
                   placeholder="Number Will Be Auto Generated"
                   id="textVpsNo" disabled>
        </div>


        <div class="col-md-2">
            <label for="textVpsCode" class="form-label">Vps Code</label>
            <input type="text" class="form-control text-start fw-bold" style="height: 80%"
                   placeholder="Code Will Be Auto Generated"
                   id="textVpsCode" disabled>
        </div>


    </div>
    <!-- Vps header area end-->


    <!--vps detail area start-->
    <div class="p-4">
        <form onsubmit="return false">
            <table class="table table-bordered" style="height: 100px">

                <tr>

                    <td>
                        <label for="textType" class="form-label">Type</label>
                        <input type="text" class="form-control text-start fw-bold" id="textType" style="height: 60px"
                               placeholder="Enter Type"
                               onkeyup="textValidator(this,'','vpsDetails','vps_details_payment_type')">
                    </td>


                    <td>
                        <label for="textAmount" class="form-label">Amount Rs.</label>
                        <input type="number" id="textAmount" class="form-control text-start fw-bold"
                               style="height: 60px" placeholder="Enter Amount Rs"
                               onkeyup="textValidator(this,'','vpsDetails','vps_details_amount')">
                    </td>


                    <td>
                        <label for="textDate" class="form-label">Date</label>
                        <input type="date" id="textDate" class="form-control text-start fw-bold"
                               style="height: 60px"
                               onchange="textValidator(this,'','vpsDetails','vps_details_date')">
                    </td>


                    <td class="text-end">
                        <button type="button" class="btn btn-lg btn-warning" style="pointer-events: all;"
                                onclick="updateVpsDetails()" id="buttonVpsDetailsUpdate">Update
                        </button>
                        <button type="button" class="btn btn-lg btn-success" style="pointer-events: all;"
                                onclick="saveVpsDetails()" id="buttonVpsDetailsAdd">Add
                        </button>
                    </td>


                </tr>


            </table>
        </form>


        <div class="row">
            <div class="col-md-5">
                <!--                div modify button 2 start-->
                <div id="divModifyButton3" class="d-none">
                    <div class="col-md-12">
                        <button type="button" class="btn btn-warning fw-bold"
                                style="width: 15%; color: whitesmoke; border: 1px solid black;"
                                onclick="refillVpsDetails(window['editOb'],window['editRow'])">
                            <i class="fa-solid fa-recycle fa-beat"></i> Refill
                        </button>
                        <button type="button" class="btn btn-danger fw-bold"
                                style=" width: 15%; color: whitesmoke; border: 1px solid black; pointer-events: all"
                                onclick="deleteVpsDetails(window['editOb'],window['editRow'])">
                            <i class="fa-solid fa-trash fa-beat"></i> Delete
                        </button>
                    </div>
                </div>
                <!--                div modify button 2 end-->
            </div>
        </div>

    </div>
    <!--vps detail area end-->


    <!--vps details table area start-->
    <div class="p-5 d-none" id="divVpsDetails">
        <table class="table table-bordered" id="tableVpsDetails">
            <thead>
            <th>#</th>
            <th>Type</th>
            <th>Amount</th>
            <th>Date</th>
            <th>Action</th>
            </thead>
            <tbody></tbody>
        </table>
    </div>
    <!--vps details table area end-->

    <!--  show remaining balance row start   -->
    <div class="row">
        <div class="col-md-4"></div>
        <div class="col-md-4">
            <h1 id="lblRemainingBalance"></h1>
        </div>
        <div class="col-md-4"></div>
    </div>
    <!--  show remaining balance row end   -->


    <!--search model area start-->
    <div class="modal fade" id="exampleModal2" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-fullscreen">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="exampleModalLabel2">search</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">

                    <div class="row">
                        <div class="col-md-10"></div>
                        <div class="col-md-2">
                            <button type="button" class="btn btn-dark" onclick="loadFullProductionTable()"
                                    id="buttonLoadFullTable">Load Full table
                            </button>
                        </div>
                    </div>

                    <!--table invoice header start-->
                    <div class="card m-4" id="divVpsHeaderTable">
                        <table class="table table-hover table-striped" id="tableVpsHeader">
                            <thead>
                            <th>#</th>
                            <th>Invoice Number</th>
                            <th>Total Invoice Value</th>
                            <th>Created Date</th>
                            <th>Vps No</th>
                            <th>action</th>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                    <!--table invoice header end-->


                    <!--table invoice full header start-->
                    <div class="card m-4" id="divVpsFullHeader">
                        <table class="table table-hover table-striped" id="tableFullVpsHeader">
                            <thead>
                            <th>#</th>
                            <th>Date</th>
                            <th>Production Number</th>
                            <th>Production Code</th>
                            <th>Action</th>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                    <!--table invoice full header end-->


                </div>
            </div>
        </div>
    </div>
    <!--search model area end-->


    <!--vps print table area start-->
    <div id="divVpsDetailsTableAreaPrint" class="d-none">
        <table class="table table-bordered"
               style="border: 1px solid black; line-height: 5px; font-family: Verdana; font-size: 11px"
               id="tableVpsDetailPrint">
            <thead style="line-height: 10px" class="text-center">
            <th>#</th>
            <th>Type</th>
            <th>Amount</th>
            <th>Date</th>
            </thead>
            <tbody>

            </tbody>
        </table>
    </div>
    <!--vps print table area end-->


</div>
</body>
</html>
