<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Stock Transfer</title>


    <!--    bootstrap cdn links-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="/commonjs/selectcommonfunction.js"></script>
    <script src="/commonjs/jquery.js"></script>
    <script src="/commonjs/validation.js"></script>
    <script src="/commonjs/ajaxcommonfunction.js"></script>
    <script src="/commonjs/tablecommonfuntion.js"></script>
    <script src="/controllerjs/stockTransfer.js"></script>


    <!--    jquery cdn start-->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.css">
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.js"></script>
    <!--    jquery cdn end-->

    <!--    google icons link-->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />



</head>
<body>

<div th:replace="~{navbar::navbar}"></div>

<div th:replace="~{offcanvas::offcanvas}"></div>


<div class="container-fluid">

    <!--header area start-->
    <div class="row p-4" style="background-color: #3C3D37;">
        <h1 class="text-center" style="color: whitesmoke">Stock Transfer Master</h1>
    </div>
    <!--header area start-->


    <!--button row start-->
    <div class="row mb-2 mt-2">


        <div class="col-md-5">
            <!--                div modify button 2 start-->
            <div id="divModifyButton2" class="d-none">
                <div class="col-md-12">
                    <button type="button" class="btn btn-warning fw-bold"
                            style="width: 15%; color: whitesmoke; border: 1px solid black;"
                            onclick="refillStockTransfer(window['editOb'],window['editRow'])">
                        <i class="fa-solid fa-recycle fa-beat"></i> Refill
                    </button>
                    <button type="button" class="btn btn-danger fw-bold"
                            style=" width: 15%; color: whitesmoke; border: 1px solid black; pointer-events: all"
                            onclick="deleteStockTransfer(window['editOb'],window['editRow'])">
                        <i class="fa-solid fa-trash fa-beat"></i> Delete
                    </button>
                    <button onclick="printStockTransfer(window['editOb'],window['editRow'])" type="button"
                            class="btn btn-primary fw-bold"
                            style=" width: 15%; color: whitesmoke;border: 1px solid black">
                        <i class="fa-solid fa-eye fa-beat"></i> Print
                    </button>
                </div>
            </div>
            <!--                div modify button 2 end-->
        </div>


        <div class="col-md-3">
            <button type="button" class="btn btn-danger" onclick="window.location.reload()">reset</button>
            <button type="button" class="btn btn-success" style="pointer-events: all" id="btnSubmitInvoiceHeader"
                    onclick="saveOrUpdateStockTransferHeader()">Submit
            </button>
        </div>


        <div class="col-md-4 text-end">
            <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#exampleModal2">
                Search
            </button>
        </div>


    </div>
    <!--button row end-->

    <!--stock transfer header area start-->
    <div class="row p-4">
        <div class="col-md-2">
            <label for="textStockTransferDate" class="form-label">Date <i class="text-danger">*</i> </label>
            <input type="date" id="textStockTransferDate" class="form-control text-start" style="height: 80%"
                   onchange="textValidator(this,'','stockTransfer','stock_transfer_header_date'); ">
        </div>
        <div class="col-md-2">
            <label for="textStockTransferNumber" class="form-label">Number</label>
            <input type="text" class="form-control text-start fw-bold" style="height: 80%" id="textStockTransferNumber"
                   placeholder="Number Will Be Auto Generated" disabled>
        </div>
        <div class="col-md-2">
            <label for="textStockTransferCode" class="form-label">Code</label>
            <input type="text" class="form-control text-start fw-bold" style="height: 80%"
                   placeholder="Code Will Be Auto Generated"
                   id="textStockTransferCode" disabled>
        </div>


    </div>
    <!--stock transfer header area end-->


    <!--stock transfer detail area start-->
    <div class="p-4">
        <form onsubmit="return false">
            <table class="table table-bordered" style="height: 100px">

                <tr style="height: 100px">

                    <td>
                        <label for="textStockTransferDetailsItem" class="form-label">Item</label>
                        <input type="text" id="textStockTransferDetailsItem" list="dataListItem"
                               class="form-control text-start fw-bold" style="height: 60px;color: gray"
                               placeholder="Type & Search Item"
                               onkeyup="dataListValidator2(this,'itemsList','stockTransferDetails','item_master_id','item_short_name')">
                        <datalist id="dataListItem"></datalist>
                    </td>

                    <td>
                        <label for="textStockTransferDetailsQuantity" class="form-label">Quantity</label>
                        <input type="text" id="textStockTransferDetailsQuantity" style="height: 60px;" class="form-control text-start fw-bold" onkeyup="textValidator(this,'','stockTransferDetails','stock_transfer_details_quantity')">
                    </td>


                    <td>
                        <label for="selectStockTransferDetailsFromLocation" class="form-label">From Location</label>
                        <select class="form-select text-start fw-bold" id="selectStockTransferDetailsFromLocation" style="color: gray; height: 60px" onchange="selectDBValidator(this,'','stockTransferDetails','from_location')"></select>
                    </td>


                    <td>
                        <label for="selectStockTransferDetailsToLocation" class="form-label">To Location</label>
                        <select class="form-select text-start fw-bold" id="selectStockTransferDetailsToLocation" style="color: gray; height: 60px" onchange="selectDBValidator(this,'','stockTransferDetails','to_location')"></select>
                    </td>


                    <td>
                        <label for="selectStockTransferDetailsDescription" class="form-label">Description</label>
                        <input type="text" id="selectStockTransferDetailsDescription" style="height: 60px;" class="form-control text-start fw-bold" onkeyup="textValidator(this,'','stockTransferDetails','stock_transfer_details_description')">
                    </td>


                    <td class="text-end">
                        <button type="button" class="btn btn-lg btn-warning" style="pointer-events: all;"
                                onclick="updateStockTransferDetails()" id="buttonStockTransferDetailsUpdate">Update
                        </button>
                        <button type="button" class="btn btn-lg btn-success" style="pointer-events: all;"
                                onclick="saveStockTransferDetails()" id="buttonStockTransferDetailsAdd">Add
                        </button>
                    </td>


                </tr>


            </table>
        </form>


        <div class="row">
            <div class="col-md-5">
                <!--                div modify button 2 start-->
                <div id="divModifyButton3" class="d-none">
                    <div class="col-md-12">
                        <button type="button" class="btn btn-warning fw-bold"
                                style="width: 15%; color: whitesmoke; border: 1px solid black;"
                                onclick="refillStockTransferDetailsFrom(window['editOb'],window['editRow'])">
                            <i class="fa-solid fa-recycle fa-beat"></i> Refill
                        </button>
                        <button type="button" class="btn btn-danger fw-bold"
                                style=" width: 15%; color: whitesmoke; border: 1px solid black; pointer-events: all"
                                onclick="deleteStockTransferDetails(window['editOb'],window['editRow'])">
                            <i class="fa-solid fa-trash fa-beat"></i> Delete
                        </button>
                    </div>
                </div>
                <!--                div modify button 2 end-->
            </div>
        </div>

    </div>
    <!--stock transfer detail area end-->


    <!--stock transfer details table area start-->
    <div class="p-5 d-none" id="divStockTransferDetails">
        <table class="table table-bordered" id="tableStockTransferDetails">
            <thead>
            <th>#</th>
            <th>Item Name</th>
            <th>Quantity</th>
            <th>From</th>
            <th>to</th>
            <th>description</th>
            <th>Action</th>
            </thead>
            <tbody></tbody>
        </table>
    </div>
    <!--stock transfer details table area end-->


    <!--search model area start-->
    <div class="modal fade" id="exampleModal2" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-fullscreen">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="exampleModalLabel2">search</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">

                    <div class="row">
                        <div class="col-md-10"></div>
                        <div class="col-md-2">
                            <button type="button" class="btn btn-dark" onclick="refreshStockTransferFullTable()"
                                    id="buttonLoadFullTable">Load Full table
                            </button>
                        </div>
                    </div>

                    <!--table invoice header start-->
                    <div class="card m-4" id="divProductionHeaderTable">
                        <table class="table table-hover table-striped" id="tableStockTransferHeader">
                            <thead>
                            <th>#</th>
                            <th>Date</th>
                            <th>Transfer Code</th>
                            <th>Transfer Number</th>
                            <th>Action</th>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                    <!--table invoice header end-->


                    <!--table invoice full header start-->
                    <div class="card m-4 d-none" id="divStockTransferFullHeader">
                        <table class="table table-hover table-striped" id="tableFullStockTransferHeader">
                            <thead>
                            <th>#</th>
                            <th>Date</th>
                            <th>Production Number</th>
                            <th>Production Code</th>
                            <th>Action</th>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                    <!--table invoice full header end-->


                </div>
            </div>
        </div>
    </div>
    <!--search model area end-->


    <!--details print table area start-->
    <div id="divProductionDetailsTableAreaPrint" class="d-none">
        <table class="table table-bordered" style="border: 1px solid black; line-height: 5px; font-family: Verdana; font-size: 11px" id="tableStockTransferDetailsPrint">
            <thead style="line-height: 10px" class="text-center">
            <th>#</th>
            <th>Item Name</th>
            <th>Quantity</th>
            <th>description</th>
            <th>From</th>
            <th>To</th>

            </thead>
            <tbody>

            </tbody>
        </table>
    </div>
    <!--details print table area end-->





</div>
</body>
</html>
