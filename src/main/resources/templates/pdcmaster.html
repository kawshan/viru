<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PDC master</title>

<!--    bootstrap cdn links-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="/commonjs/selectcommonfunction.js"></script>
    <script src="/commonjs/jquery.js"></script>
    <script src="/commonjs/validation.js"></script>
    <script src="/commonjs/ajaxcommonfunction.js"></script>
    <script src="/commonjs/tablecommonfuntion.js"></script>
    <script src="/controllerjs/pdcMaster.js"></script>



    <!--    jquery cdn start-->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.css">
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.js"></script>
    <!--    jquery cdn end-->


    <!--    google icons link-->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

</head>
<body>

<!--<div th:replace="~{navbar::navbar}"></div>-->

<!--<div th:replace="~{offcanvas::offcanvas}"></div>-->


<!--header area start-->
<div class="row p-4" style="background-color: #3C3D37;">
    <h1 class="text-center" style="color: whitesmoke">PDC Master</h1>
</div>
<!--header area start-->


<!--    edit delete print button start-->
<div class="row mt-2">
    <div id="divModifyButton" class="d-none">
        <div class="col-md-6">
            <button type="button" class="btn btn-warning fw-bold"
                    style="width: 15%; color: whitesmoke; border: 1px solid black;"
                    onclick="refillPdc(window['editOb'],window['editRow'])">
                <i class="fa-solid fa-recycle fa-beat"></i> refill
            </button>
            <button type="button" id="divModifyButtonDelete" class="btn btn-danger fw-bold"
                    style=" width: 15%; color: whitesmoke; border: 1px solid black; pointer-events: all"
                    onclick="deletePdc(window['editOb'],window['editRow'])">
                <i class="fa-solid fa-trash fa-beat"></i> Delete
            </button>
            <button onclick="printOnePdc(window['editOb'],window['editRow'])" type="button"
                    class="btn btn-primary fw-bold"
                    style=" width: 15%; color: whitesmoke;border: 1px solid black">
                <i class="fa-solid fa-eye fa-beat"></i> Print
            </button>
        </div>
    </div>
</div>
<!--    edit delete print button end-->



<!--form area start-->
<div class="card p-5">
    <form onsubmit="return false">

        <div class="row mt-5"  style="margin-bottom: 20px">
            <div class="col-md-2">
                <label for="textPdcCreateDate" class="form-label">Date</label>
                <input type="date" id="textPdcCreateDate" style="height: 80%" class="form-control text-start fw-bold" onchange="textValidator(this,'','PdcMaster','pdc_master_created_date')">
            </div>
            <div class="col-md-4">
                <label for="textPdcBankName" class="form-label">Bank Name</label>
                <input type="text" id="textPdcBankName" style="height: 80%" class="form-control text-start fw-bold" onkeyup="textValidator(this,'','PdcMaster','pdc_master_bank_name')">
            </div>


            <div class="col-md-4">
                <label for="textPdcBranchName" class="form-label">Branch Name</label>
                <input type="text" id="textPdcBranchName" style="height: 80%" class="form-control text-start fw-bold" onkeyup="textValidator(this,'','PdcMaster','pdc_master_branch_name')">
            </div>


            <div class="col-md-2">
                <label for="textPdcChequeNo" class="form-label">Cheque No</label>
                <input type="number" id="textPdcChequeNo" style="height: 80%" class="form-control text-start fw-bold" onkeyup="textValidator(this,'','PdcMaster','pdc_master_cheque_no')">
            </div>
        </div>


        <div class="row mt-5">
            <div class="col-md-2">
                <label for="textPdcAmount" class="form-label">Amount</label>
                <input type="number" id="textPdcAmount" style="height: 80%" class="form-control text-start fw-bold" onkeyup="textValidator(this,'','PdcMaster','pdc_master_amount')">
            </div>


            <div class="col-md-2">
                <label for="textPdcDate" class="form-label">Pdc Date</label>
                <input type="date" id="textPdcDate" style="height: 80%" class="form-control text-start fw-bold" onchange="textValidator(this,'','PdcMaster','pdc_master_pdc_date')">
            </div>


            <div class="col-md-2">
                <label for="selectPdcStatus" class="form-label">Status <i class="text-danger fw-bold">*</i> </label>
                <select id="selectPdcStatus" class="form-select text-start fw-bold" style="color: gray; height: 80%"  onchange="selectDBValidator(this,'','PdcMaster','pdc_status_id')"></select>
            </div>
        </div>


        <div class="row mt-5">
            <div class="col-md-4 text-start">
                <button type="button" class="btn btn-danger" onclick="window.location.reload()">Reset</button>
            </div>
            <div class="col-md-4 text-center">
                <button type="button" class="btn btn-warning" id="buttonPdcUpdate" style="pointer-events: all" onclick="updatePDC()">Update</button>
            </div>
            <div class="col-md-4 text-end">
                <button type="button" class="btn btn-primary" id="buttonPdcSave" style="pointer-events: all" onclick="submitPdcMaster()">Save</button>
            </div>
        </div>


    </form>
</div>
<!--form area end-->



<!--print full table button row start-->
<div class="row mt-5">
    <div class="col-md-10"></div>
    <div class="col-md-2 text-start">
        <button type="button" class="btn btn-primary" onclick="printPdcFullTable()">Print Full Table</button>
    </div>
</div>
<!--print full table button row end-->



<!--item category table start-->
<div class="card m-5 p-5">
<table class="table table-bordered" id="tablePDCMaster">
<thead class="text-center">
    <th>#</th>
    <th>Created Date</th>
    <th>Bank Name</th>
    <th>Branch Name</th>
    <th>Cheque No</th>
    <th>Amount</th>
    <th>PDC date</th>
    <th>Status</th>
    <th>Action</th>
</thead>
    <tbody></tbody>
</table>
</div>
<!--item category table start-->


<!--table print start-->
<div id="divItemCategoryTablePrint" class="d-none">
    <table class="table table-bordered" id="tablePDCMasterPrint">
        <thead class="text-center">
        <th>#</th>
        <th>Created Date</th>
        <th>Bank Name</th>
        <th>Branch Name</th>
        <th>Cheque No</th>
        <th>Amount</th>
        <th>PDC date</th>
        <th>Status</th>
        </thead>
        <tbody></tbody>
    </table>
</div>
<!--table print end-->



</body>
</html>
