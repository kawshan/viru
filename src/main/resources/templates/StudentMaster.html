<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student master</title>

    <!--    bootstrap cdn links-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="/commonjs/selectcommonfunction.js"></script>
    <script src="/commonjs/jquery.js"></script>
    <script src="/commonjs/validation.js"></script>
    <script src="/commonjs/ajaxcommonfunction.js"></script>
    <script src="/commonjs/tablecommonfuntion.js"></script>
    <script src="/controllerjs/studentMaster.js"></script>



    <!--    jquery cdn start-->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.css">
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.js"></script>
    <!--    jquery cdn end-->

    <!--    google icons link-->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />



</head>
<body>

<!--<div th:replace="~{navbar::navbar}"></div>-->

<!--<div th:replace="~{offcanvas::offcanvas}"></div>-->

<!--header area start-->
<div class="row p-4" style="background-color: #3C3D37;">
    <h1 class="text-center" style="color: whitesmoke">Student Master</h1>
</div>
<!--header area start-->

<!--    edit delete print button start-->
<div class="row mt-2">
    <div id="divModifyButton" class="d-none">
        <div class="col-md-6">
            <button type="button" class="btn btn-warning fw-bold"
                    style="width: 15%; color: whitesmoke; border: 1px solid black;"
                    onclick="refillStudent(window['editOb'],window['editRow'])">
                <i class="fa-solid fa-recycle fa-beat"></i> refill
            </button>
            <button type="button" id="divModifyButtonDelete" class="btn btn-danger fw-bold"
                    style=" width: 15%; color: whitesmoke; border: 1px solid black; pointer-events: all"
                    onclick="deleteStudent(window['editOb'],window['editRow'])">
                <i class="fa-solid fa-trash fa-beat"></i> Delete
            </button>
            <button onclick="printOneItem(window['editOb'],window['editRow'])" type="button"
                    class="btn btn-primary fw-bold"
                    style=" width: 15%; color: whitesmoke;border: 1px solid black">
                <i class="fa-solid fa-eye fa-beat"></i> Print
            </button>
        </div>
    </div>
</div>
<!--    edit delete print button end-->

<!--form area start-->
<div class="card p-5">
    <form onsubmit="return false">

<div class="ms-5">
        <div class="row mt-5">
            <div class="col-md-2">
                <label for="selectSchool" class="form-label">School Name<i class="text-danger">*</i> </label>
            </div>
            <div class="col-md-10">
                <select id="selectSchool" class="form-select text-start fw-bold" style="height: 150%; color: cornflowerblue; font-weight: bold " onchange="selectDBValidator(this,'','studentMaster','school_master_id')"></select>
            </div>
        </div>

        <div>
            <button type="button" onclick="return false;" class="rounded-5" style="background-color: #0a0a0a; height: 70px; width: 150px; color: whitesmoke;">Student Details</button>
            <hr style="border: none; border-top: 8px solid #0a0a0a; margin: 0">
        </div>


    <div class="row mt-5">
        <div class="col-md-2">
            <label for="textStudentFullName" class="form-label">Student Full Name <i class="text-danger">*</i> </label>
        </div>

        <div class="col-md-10">
            <input type="text" id="textStudentFullName" class="form-control text-start fw-bold" style="height: 50px" placeholder="Enter Student's Full Name" onkeyup="textValidator(this,'','studentMaster','student_master_full_name')">
        </div>

    </div>



    <div class="row mt-5">
        <div class="col-md-4">
            <label for="selectGrade" class="form-label">Select Grade <i class="text-danger">*</i> </label>
            <select id="selectGrade" class="form-select text-start fw-bold" style="height: 50px; color: gray" onchange="selectDBValidator(this,'','studentMaster','grade_id')"></select>
        </div>
        <div class="col-md-4">
            <label for="textStudentAdmissionNumber" class="form-label">Student Admission No  </label>
            <input type="text" id="textStudentAdmissionNumber" class="form-control text-start fw-bold" style="height: 50px" placeholder="Enter Student's Admission No" onkeyup="textValidator(this,'','studentMaster','student_master_addmission_no')">
        </div>
    </div>

    <div class="row mt-5">
        <label for="textPermanentAddress" class="form-label">Permanent Address <i class="text-danger">*</i> </label>
        <input type="text" id="textPermanentAddress" class="form-control text-start fw-bold" style="height: 50px" placeholder="Enter Permanent Address" onkeyup="textValidator(this,'','studentMaster','student_master_permenent_residence')">
    </div>


    <div class="mt-5">
        <button type="button" onclick="return false;" class="rounded-5" style="background-color: #080710; height: 70px; width: 150px; color: whitesmoke;">Guardian Details</button>
        <hr style="border: none; border-top: 8px solid black; margin: 0">
    </div>



    <div class="row mt-5">
        <div class="col-md-2">
            <label for="textGuardianFullName" class="form-label">Full Name <i class="text-danger">*</i> </label>
        </div>
        <div class="col-md-10">
            <input type="text" id="textGuardianFullName" class="form-control text-start fw-bold" style="height: 70px" placeholder="Enter Guardian Full Name" onkeyup="textValidator(this,'','studentMaster','student_master_guardian_full_name')">
        </div>
    </div>

    <div class="row mt-5">
        <div class="col-md-4">
            <label for="textGuardianNic" class="form-label">NIC</label>
            <input type="text" id="textGuardianNic" class="form-control text-start fw-bold" style="height: 70px" placeholder="Enter Guardian NIC" onkeyup="textValidator(this,'','studentMaster','student_master_guardian_nic')">
        </div>

        <div class="col-md-4">
            <label for="textMobileNumber" class="form-label">Mobile <i class="text-danger">*</i> </label>
            <input type="text" id="textMobileNumber" class="form-control text-start fw-bold" style="height: 70px" placeholder="Enter Guardian Mobile Number" onkeyup="textValidator(this,'','studentMaster','student_master_guardian_contact_no_mobile')">
        </div>

        <div class="col-md-4">
            <label for="textHomeNumber" class="form-label">Land No <i class="text-primary">(optional)</i> </label>
            <input type="text" id="textHomeNumber" class="form-control text-start fw-bold" style="height: 70px" placeholder="Enter Land No" onkeyup="textValidator(this,'','studentMaster','student_master_guardian_contact_no_home')">
        </div>


    </div>

    <div class="row mt-5">
        <div class="col-md-2">
            <label for="selectStudentStatus" class="form-label">status <i class="text-danger">*</i> </label>
            <select id="selectStudentStatus" style="height: 80%; color: gray" class="form-select text-start fw-bold" onchange="selectValidator(this,'','studentMaster','student_master_status')">
                <option value="" selected disabled>Select Status</option>
                <option value="true">Active</option>
                <option value="false">Inactive</option>
            </select>
        </div>
    </div>





</div>

        <div class="row mt-5">
            <div class="col-md-4 text-start">
                <button type="button" class="btn btn-danger" onclick="window.location.reload()">Reset</button>
            </div>
            <div class="col-md-4 text-center">
                <button type="button" class="btn btn-warning" id="buttonUpdateStudentMaster" style="pointer-events: all" onclick="updateStudent()">Update</button>
            </div>
            <div class="col-md-4 text-end">
                <button type="button" class="btn btn-primary" id="buttonSaveStudentMaster" style="pointer-events: all" onclick="saveStudentMaster()">Save</button>
            </div>

        </div>


    </form>
</div>
<!--form area end-->

<!--print full table area start-->
<div class="row mt-5">
    <div class="col-md-10"></div>
    <div class="col-md-2">
        <button type="button" class="btn btn-primary" onclick="printAllItem()">Print Full Table</button>
    </div>
</div>
<!--print full table area end-->

<!--student master table start-->
<div class="card m-5 p-5">
    <table class="table table-bordered" id="tableStudentMaster">
        <thead class="text-center">
            <th>#</th>
            <th>School</th>
            <th>Student Name</th>
            <th>Grade</th>
            <th>Address</th>
            <th>Guardian Name</th>
            <th>Mobile</th>
            <th>Home</th>
            <th>Action</th>
        </thead>
        <tbody></tbody>
    </table>
</div>
<!--student master table end-->

<!--print table area start-->
<div id="divTableItemMasterPrint" class="d-none">
    <table class="table table-bordered" id="tableItemMasterPrint" style="font-size: 11px; border: 1px solid black">
        <thead class="text-center">
        <th>#</th>
        <th>Category</th>
        <th>Name</th>
        <th>Short Name</th>
        <th>Size</th>
        <th>Number Of Pages</th>
        <th>cost</th>
        <th>Price</th>
        <th>Status</th>
        </thead>
        <tbody></tbody>
    </table>
</div>
<!--print table area end-->



</body>
</html>
